[project]
name = "razorpay-hackathon"
version = "0.1.0"
description = "Agent-Native Checkout Race: WebMCP kit on a real store, timed vs manual (Razorpay test mode)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "langgraph>=1.2.11",
    "langchain-groq>=1.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# HTML template strings in route handlers exceed line length by design
"sidecar/app.py" = ["E501"]
"agent/app.py" = ["E501"]
